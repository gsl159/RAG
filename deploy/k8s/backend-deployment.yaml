apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rag-system
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rag-system
    app.kubernetes.io/component: api
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rag-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rag-system
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rag-system
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: rag-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: rag-system
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U raguser -d ragdb; do
                echo "Waiting for postgres..."
                sleep 2
              done
              echo "Postgres is ready"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-system-secret
                  key: POSTGRES_PASSWORD
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis ping; do
                echo "Waiting for redis..."
                sleep 2
              done
              echo "Redis is ready"
        - name: wait-for-milvus
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z milvus 19530; do
                echo "Waiting for milvus..."
                sleep 2
              done
              echo "Milvus is ready"
      containers:
        - name: backend
          image: rag-system-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rag-system-config
            - secretRef:
                name: rag-system-secret
          env:
            - name: GUNICORN_WORKERS
              value: "2"
            - name: GUNICORN_MAX_REQUESTS
              value: "10000"
            - name: GUNICORN_MAX_REQUESTS_JITTER
              value: "1000"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: backend-logs
              mountPath: /var/log/rag-system
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: backend-logs
          emptyDir: {}
