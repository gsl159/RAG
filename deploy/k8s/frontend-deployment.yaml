apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rag-system
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: rag-system
    app.kubernetes.io/component: web
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: rag-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rag-system
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: rag-system
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: rag-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: rag-system
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: rag-system-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "64m"
            limits:
              memory: "256Mi"
              cpu: "128m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
