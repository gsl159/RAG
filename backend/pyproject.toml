[project]
name = "rag-backend"
version = "2.0.0"
description = "RAG backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
]
ignore = [
  "B008",  # Depends in defaults — FastAPI pattern
  "E501",  # line length — handled by formatter discretion
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
